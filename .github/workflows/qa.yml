name: qa
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Run QA
        working-directory: ./web
        run: pnpm run qa
